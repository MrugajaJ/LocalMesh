name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build JARs and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set lowercase repository owner
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build all Maven artifacts
        run: |
          mvn -f api/pom.xml package -DskipTests -q
          mvn -f controller/pom.xml package -DskipTests -q
          mvn -f sidecar/pom.xml package -DskipTests -q

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/localmesh-api:latest
            ${{ env.IMAGE_PREFIX }}/localmesh-api:${{ github.sha }}

      - name: Build & Push Controller Image
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/localmesh-controller:latest
            ${{ env.IMAGE_PREFIX }}/localmesh-controller:${{ github.sha }}

      - name: Build & Push Sidecar Image
        uses: docker/build-push-action@v5
        with:
          context: ./sidecar
          file: ./sidecar/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/localmesh-sidecar:latest
            ${{ env.IMAGE_PREFIX }}/localmesh-sidecar:${{ github.sha }}
