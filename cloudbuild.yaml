steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/localmesh-api:$COMMIT_SHA', './api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/localmesh-api:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'localmesh-api'
      - '--image=gcr.io/$PROJECT_ID/localmesh-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--set-env-vars=PORT=8080'
      - '--set-secrets=POSTGRES_URL=localmesh-postgres-url:latest,POSTGRES_USER=localmesh-postgres-user:latest,POSTGRES_PASSWORD=localmesh-postgres-password:latest,REDIS_URL=localmesh-redis-url:latest'

images:
  - 'gcr.io/$PROJECT_ID/localmesh-api:$COMMIT_SHA'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
