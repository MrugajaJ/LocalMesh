---
# ServiceAccount for the LocalMesh Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: localmesh-controller
  namespace: default
  labels:
    app.kubernetes.io/part-of: localmesh
    app.kubernetes.io/component: controller

---
# ClusterRole — grants controller permissions to manage pods, services, and CRDs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: localmesh-controller
  labels:
    app.kubernetes.io/part-of: localmesh
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, namespaces]
    verbs:     [get, list, watch, patch, update]

  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs:     [get, list, watch, patch, update]

  - apiGroups: [localmesh.dev]
    resources: [localmeshintercepts, localmeshintercepts/status]
    verbs:     [get, list, watch, create, update, patch, delete]

  - apiGroups: [""]
    resources: [events]
    verbs:     [create, patch]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: localmesh-controller
  labels:
    app.kubernetes.io/part-of: localmesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     ClusterRole
  name:     localmesh-controller
subjects:
  - kind:      ServiceAccount
    name:      localmesh-controller
    namespace: default
