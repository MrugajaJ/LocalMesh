apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: localmeshintercepts.localmesh.dev
  labels:
    app.kubernetes.io/part-of: localmesh
spec:
  group: localmesh.dev
  names:
    kind:     LocalMeshIntercept
    listKind: LocalMeshInterceptList
    plural:   localmeshintercepts
    singular: localmeshintercept
    shortNames:
      - lmi
  scope:   Namespaced
  versions:
    - name: v1alpha1
      served:  true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serviceName
                - namespace
                - localPort
                - developerSessionId
              properties:
                serviceName:
                  type: string
                  description: Name of the Kubernetes service to intercept
                namespace:
                  type: string
                  description: Kubernetes namespace of the service
                  default: "default"
                localPort:
                  type: integer
                  description: Local port on the developer's machine
                  minimum: 1
                  maximum: 65535
                developerSessionId:
                  type: string
                  description: UUID of the developer session (from developer_sessions table)
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [PENDING, ACTIVE, FAILED, TORN_DOWN]
                tunnelEndpoint:
                  type: string
                  description: gRPC tunnel endpoint the sidecar connects to
                message:
                  type: string
                  description: Human-readable status message
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.serviceName
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
