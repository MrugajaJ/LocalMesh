      containers:
        - name: notification-service
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: "notification-service"
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "200m" }

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
