---
# order-service — demo HTTP service (httpbin)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    app.kubernetes.io/part-of: localmesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
          env:
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service/payments"
            - name: SERVICE_NAME
              value: "order-service"
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "200m" }

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# payment-service — the one developers intercept
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
    app.kubernetes.io/part-of: localmesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
          env:
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service/notify"
            - name: SERVICE_NAME
              value: "payment-service"
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "200m" }

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
