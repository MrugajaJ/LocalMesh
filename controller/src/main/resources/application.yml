spring:
  application:
    name: localmesh-controller

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/localmesh}
    username: ${POSTGRES_USER:localmesh}
    password: ${POSTGRES_PASSWORD:localmesh}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jooq:
    sql-dialect: POSTGRES

server:
  port: ${SERVER_PORT:8090}

localmesh:
  redis:
    uri: ${REDIS_URL:redis://localhost:6379}
  grpc:
    port: ${GRPC_PORT:50051}
  controller:
    heartbeat-timeout-seconds: 30
    reconcile-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.localmesh: DEBUG
    io.kubernetes: WARN
    org.jooq: WARN
